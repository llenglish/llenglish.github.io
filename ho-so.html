<!doctype html>
<html lang="vi" data-require="login">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hồ sơ - Mầm</title>
<meta name="description" content="Cập nhật thông tin cá nhân và đổi mật khẩu.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0F766E">
<link rel="icon" type="image/svg+xml" href="mam-wave.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="config.js"></script>
<script src="courses.js"></script>
<script src="auth.js"></script>
<script src="auth-ui.js" defer></script>
<script src="app.js" defer></script>
<script src="account.js" defer></script>
</head>
<body>
<a class="skip" href="#main">Bỏ qua, đến nội dung chính</a>
<header class="site-header">
  <div class="wrap">
    <a class="brand" href="index.html"><img src="mam-wave.svg" alt="Mầm, nhân vật cổ vũ" width="48" height="48"><span>Mầm</span></a>
    <nav class="main-nav" aria-label="Menu chính">
      <a href="index.html" aria-current="page">Giới thiệu</a>
      <a href="khoa-hoc.html" aria-current="page">Khóa học</a>
      <a href="goi-hoc.html" aria-current="page">Gói học</a>
      <a href="index.html#hoi-dap">Hỏi đáp</a>
    </nav>
    <div class="head-actions"></div>
  </div>
</header>
<main id="main" class="page-narrow">
  <div><h1 class="page-title" style="font-size:clamp(32px,5vw,48px)">Hồ sơ của tôi</h1><p class="lead" style="margin-top:6px">Vai trò: <strong id="pRole"></strong></p></div>

  <section class="sec-card" aria-labelledby="h-prof">
    <h2 id="h-prof">Thông tin cá nhân</h2>
    <form id="profForm">
      <div class="field"><label for="pEmail">Email (không đổi được)</label><input id="pEmail" type="email" readonly></div>
      <div class="field"><label for="pTen">Họ và tên</label><input id="pTen" type="text" autocomplete="name"></div>
      <div class="field"><label for="pSdt">Số điện thoại</label><input id="pSdt" type="tel" autocomplete="tel"></div>
      <p class="err" id="profMsg" role="alert" hidden></p>
      <button class="btn btn-primary btn-sm" type="submit">Lưu thay đổi</button>
    </form>
  </section>

  <section class="sec-card" aria-labelledby="h-pw">
    <h2 id="h-pw">Đổi mật khẩu</h2>
    <form id="pwForm">
      <div class="field"><label for="pwOld">Mật khẩu hiện tại</label><input id="pwOld" type="password" autocomplete="current-password"></div>
      <div class="field"><label for="pwNew">Mật khẩu mới (ít nhất 8 ký tự)</label><input id="pwNew" type="password" autocomplete="new-password"></div>
      <p class="err" id="pwMsg" role="alert" hidden></p>
      <button class="btn btn-primary btn-sm" type="submit">Đổi mật khẩu</button>
    </form>
    <div id="recBox" hidden style="display:flex;flex-direction:column;gap:10px">
      <p class="ok-box">Đã đổi mật khẩu. Mã khôi phục cũ không còn dùng được, hãy lưu mã mới:</p>
      <div class="code-box" id="recCode"></div>
      <div class="btn-row"><button type="button" class="btn btn-outline btn-sm" id="recCopy">Sao chép mã</button></div>
    </div>
  </section>
</main>
</body>
</html>
